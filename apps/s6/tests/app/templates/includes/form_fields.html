{{ form.csrf_token }} 
<dl>
    {% for field in form %}
        {% if field.type != 'CSRFTokenField' %}
            <dt>
                {{ field.label }}
                {% if field.flags.required %}*{% endif %}
            </dt>
            <dd>
                {{ field }}
                {% if field.errors %}
                    <ul class="errors">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </dd>
        {% endif %}
    {% endfor %}
</dl>
<input type="submit" value="{{ submit_label }}" class="button is-rounded negative">
